name: Futbalový kvíz – Android build

on:
  push:
    paths:
      - "futbal-kviz/**"
      - ".github/workflows/futbal-kviz.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: futbal-kviz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: futbal-kviz-apk
          path: futbal-kviz/app/build/outputs/apk/debug/app-debug.apk
